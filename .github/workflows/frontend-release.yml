name: Build website release

on:
  push:
    branches: [ui-redesign, codex/recharge-ui]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tools:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Test BAT runners and fresh client installs
        env:
          WUKONGAI_REAL_INSTALL_TESTS: '1'
        run: bun run test --no-file-parallelism src/features/quick-setup/__tests__/windows-tools.test.ts src/features/quick-setup/__tests__/windows-installer.test.ts src/features/quick-setup/__tests__/codex-desktop.test.ts src/features/quick-setup/__tests__/desktop-clients.test.ts src/features/quick-setup/__tests__/imagegen.test.ts
  build:
    needs: windows-tools
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      GOMEMLIMIT: 1536MiB
      GOMAXPROCS: '2'
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Check types
        run: bun run typecheck
      - name: Test recharge and configuration tools
        run: bun run test src/features/wallet/__tests__/recharge-layout.test.tsx src/features/quick-setup/__tests__/windows-tools.test.ts src/features/quick-setup/__tests__/quick-setup-dialog.test.tsx src/features/quick-setup/__tests__/mac-tools.test.ts
      - name: Lint website components
        run: bunx oxlint -c .oxlintrc.json src/features/wallet/components/recharge-dialog.tsx src/features/wallet/components/recharge-form-card.tsx src/features/wallet/__tests__/recharge-layout.test.tsx src/components/layout/components/public-header.tsx src/features/quick-setup/configuration.ts src/features/quick-setup/windows-tools.ts src/features/quick-setup/windows-config.mjs src/features/quick-setup/quick-setup-dialog.tsx src/features/quick-setup/__tests__/windows-tools.test.ts src/features/quick-setup/__tests__/windows-installer.test.ts src/features/get-started/index.tsx src/features/home/components/sections/how-it-works.tsx rsbuild.config.ts
      - name: Check recharge formatting
        run: bunx oxfmt --check src/features/wallet/components/recharge-dialog.tsx src/features/wallet/components/recharge-form-card.tsx src/features/wallet/__tests__/recharge-layout.test.tsx src/components/layout/components/public-header.tsx src/features/quick-setup/configuration.ts src/features/quick-setup/windows-tools.ts src/features/quick-setup/windows-config.mjs src/features/quick-setup/quick-setup-dialog.tsx src/features/quick-setup/__tests__/windows-tools.test.ts src/features/quick-setup/__tests__/windows-installer.test.ts src/features/get-started/index.tsx src/features/home/components/sections/how-it-works.tsx rsbuild.config.ts
      - run: bun run build
      - name: Package compiled website
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/build-commit.txt
          tar czf ../wukongai-web.tgz dist
          cd ..
          sha256sum wukongai-web.tgz > wukongai-web.tgz.sha256
      - name: Publish compiled release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="web-${GITHUB_SHA:0:12}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "Website ${GITHUB_SHA:0:12}" --notes 'Compiled website assets. Deploy with scripts/update-web.sh; no server-side build is required.' --latest
          gh release upload "$tag" wukongai-web.tgz wukongai-web.tgz.sha256 --clobber
